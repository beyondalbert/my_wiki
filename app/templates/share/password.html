{% extends "base.html" %}
{% block title %}请输入访问密码{% endblock %}
{% block content %}
<div class="min-h-[calc(100vh-3.5rem)] flex items-center justify-center px-4 py-10">
  <div class="w-full max-w-md bg-white border border-slate-200 rounded-2xl p-8">
    <h1 class="text-xl font-semibold text-slate-800 text-center">🔒 请输入访问密码</h1>
    <p class="text-sm text-slate-500 mt-2 text-center">该分享链接受密码保护</p>
    <form method="post" class="mt-6 space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <input type="password" name="password" required autofocus
             class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" />
      <button class="w-full py-2.5 bg-indigo-600 text-white rounded-lg hover:bg-indigo-500">解锁</button>
    </form>
  </div>
</div>
{% endblock %}
