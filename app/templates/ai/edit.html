{% extends "base.html" %}
{% block title %}编辑 AI 知识库 · {{ ai_kb.name }}{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto px-4 py-10">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold text-slate-800">编辑 AI 知识库</h1>
    <a href="{{ url_for('ai.detail', ai_kb_id=ai_kb.id) }}" class="text-sm text-slate-500 hover:text-violet-600">← 返回详情</a>
  </div>
  <form method="post" action="{{ url_for('ai.edit_ai_kb', ai_kb_id=ai_kb.id) }}"
        class="bg-white border border-slate-200 rounded-2xl p-6 space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">名称 *</label>
      <input name="name" required maxlength="80" value="{{ ai_kb.name }}"
             class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" />
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">描述</label>
      <textarea name="description" rows="3" maxlength="500"
                class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">{{ ai_kb.description or '' }}</textarea>
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Chat 模型（留空使用全局默认）</label>
      <input name="chat_model" placeholder="如 gpt-4o-mini / deepseek-chat / qwen-plus"
             value="{{ ai_kb.chat_model or '' }}"
             class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" />
      <p class="text-xs text-slate-400 mt-1">若留空，将使用「系统设置 → AI / 大模型配置」中的全局模型</p>
    </div>
    <label class="flex items-center gap-2 text-sm">
      <input type="checkbox" name="enable_rag" class="rounded text-indigo-600" {% if ai_kb.enable_rag %}checked{% endif %} />
      启用 RAG 检索增强（可选，需要服务端开启 ENABLE_RAG）
    </label>
    <div class="flex items-center justify-between pt-2">
      <div class="flex gap-2">
        <button class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-500">保存</button>
        <a class="px-4 py-2 border border-slate-300 rounded-lg hover:bg-slate-50" href="{{ url_for('ai.detail', ai_kb_id=ai_kb.id) }}">取消</a>
      </div>
    </div>
  </form>

  <div class="mt-8 bg-rose-50 border border-rose-200 rounded-2xl p-6">
    <h2 class="text-base font-semibold text-rose-700">危险操作</h2>
    <p class="text-sm text-rose-600 mt-1">
      删除该 AI 知识库会同时移除其所有 Wiki 条目、源关联与本地 Wiki 文件，此操作不可恢复。
      <br/>原始文档不会被删除。
    </p>
    <form method="post" action="{{ url_for('ai.delete_ai_kb', ai_kb_id=ai_kb.id) }}" class="mt-3"
          onsubmit="return confirm('确定永久删除『{{ ai_kb.name }}』及其全部 Wiki 内容？');">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <button class="px-4 py-2 bg-rose-600 text-white rounded-lg hover:bg-rose-500 text-sm">永久删除该 AI 知识库</button>
    </form>
  </div>
</div>
{% endblock %}
