{% extends "base.html" %}
{% block title %}注册 · {{ site_name }}{% endblock %}
{% block content %}
<div class="min-h-[calc(100vh-3.5rem)] flex items-center justify-center px-4 py-10 bg-gradient-to-br from-slate-50 to-indigo-50">
  <div class="w-full max-w-md bg-white border border-slate-200 rounded-2xl shadow-sm p-8">
    <div class="text-center mb-6">
      <div class="w-12 h-12 mx-auto rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-lg shadow">麦</div>
      <h1 class="mt-3 text-xl font-semibold text-slate-800">创建你的 {{ site_name }} 账号</h1>
      <p class="text-sm text-slate-500 mt-1">完成注册即可开始构建你的第二大脑</p>
    </div>
    <form method="post" class="space-y-4" x-data="{captchaTs: Date.now()}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">用户名</label>
        <input name="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_\-]+" value="{{ form.username or '' }}"
               class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" />
        <p class="text-xs text-slate-400 mt-1">3-32 位，可使用字母、数字、下划线、短横线</p>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">邮箱</label>
        <input type="email" name="email" required value="{{ form.email or '' }}"
               class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">密码</label>
        <input type="password" name="password" required minlength="8"
               class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" />
        <p class="text-xs text-slate-400 mt-1">至少 8 位，建议混合字母与数字</p>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">确认密码</label>
        <input type="password" name="password2" required minlength="8"
               class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">验证码</label>
        <div class="flex gap-2">
          <input name="captcha" required maxlength="6"
                 class="flex-1 px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" />
          <img :src="'{{ url_for('auth.captcha') }}?_=' + captchaTs"
               @click="captchaTs = Date.now()"
               class="h-10 rounded-lg border border-slate-200 cursor-pointer" alt="验证码" title="点击换一张" />
        </div>
      </div>
      <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg shadow-sm">注册</button>
    </form>
    <p class="text-center text-sm text-slate-500 mt-6">
      已经有账号？<a class="text-indigo-600 hover:underline" href="{{ url_for('auth.login') }}">直接登录</a>
    </p>
  </div>
</div>
{% endblock %}
