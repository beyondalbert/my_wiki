{% extends "base.html" %}
{% block title %}编辑知识库 · {{ site_name }}{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto px-4 py-10">
  <h1 class="text-2xl font-bold text-slate-800 mb-6">编辑知识库</h1>
  <form method="post" class="bg-white border border-slate-200 rounded-2xl p-6 space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">名称</label>
      <input name="name" required maxlength="80" value="{{ kb.name }}"
             class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" />
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">描述</label>
      <textarea name="description" rows="3" maxlength="500"
                class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">{{ kb.description or '' }}</textarea>
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">可见性</label>
      <select name="visibility" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        <option value="private" {{ 'selected' if kb.visibility=='private' }}>私密</option>
        <option value="members" {{ 'selected' if kb.visibility=='members' }}>成员</option>
        <option value="public"  {{ 'selected' if kb.visibility=='public'  }}>公开</option>
      </select>
    </div>
    <div class="flex gap-2 pt-2">
      <button class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-500" type="submit">保存</button>
      <a class="px-4 py-2 border border-slate-300 rounded-lg hover:bg-slate-50" href="{{ url_for('kb.detail', kb_id=kb.id) }}">取消</a>
      <form method="post" action="{{ url_for('kb.delete_kb', kb_id=kb.id) }}" class="ml-auto"
            onsubmit="return confirm('确认归档此知识库吗？')">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <button class="px-4 py-2 border border-rose-200 text-rose-600 rounded-lg hover:bg-rose-50" type="submit">归档</button>
      </form>
    </div>
  </form>
</div>
{% endblock %}
