{% extends "base.html" %}
{% block title %}新建 AI 知识库{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto px-4 py-10">
  <h1 class="text-2xl font-bold text-slate-800 mb-6">新建 AI 知识库</h1>
  <form method="post" class="bg-white border border-slate-200 rounded-2xl p-6 space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">名称 *</label>
      <input name="name" required maxlength="80"
             class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-violet-500 outline-none" />
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">描述</label>
      <textarea name="description" rows="3" maxlength="500"
                class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-violet-500 outline-none"></textarea>
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Chat 模型（留空使用全局默认）</label>
      <input name="chat_model" placeholder="如 gpt-4o-mini / deepseek-chat / qwen-plus"
             class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-violet-500 outline-none" />
    </div>
    <label class="flex items-center gap-2 text-sm">
      <input type="checkbox" name="enable_rag" class="rounded text-violet-600" />
      启用 RAG 检索增强（可选，需要服务端开启 ENABLE_RAG）
    </label>
    <div class="flex gap-2 pt-2">
      <button class="px-4 py-2 bg-violet-600 text-white rounded-lg hover:bg-violet-500">创建</button>
      <a class="px-4 py-2 border border-slate-300 rounded-lg hover:bg-slate-50" href="{{ url_for('ai.index') }}">取消</a>
    </div>
  </form>
</div>
{% endblock %}
