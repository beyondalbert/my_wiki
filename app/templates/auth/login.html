{% extends "base.html" %}
{% block title %}登录 · {{ site_name }}{% endblock %}
{% block content %}
<div class="min-h-[calc(100vh-3.5rem)] flex items-center justify-center px-4 py-10 bg-gradient-to-br from-slate-50 to-indigo-50">
  <div class="w-full max-w-md bg-white border border-slate-200 rounded-2xl shadow-sm p-8">
    <div class="text-center mb-6">
      <div class="w-12 h-12 mx-auto rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-lg shadow">麦</div>
      <h1 class="mt-3 text-xl font-semibold text-slate-800">欢迎回到 {{ site_name }}</h1>
      <p class="text-sm text-slate-500 mt-1">请使用账号或邮箱登录</p>
    </div>
    <form method="post" class="space-y-4" x-data="{captchaTs: Date.now()}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">用户名 / 邮箱</label>
        <input name="login" required autofocus value="{{ form.login or '' }}"
               class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">密码</label>
        <input type="password" name="password" required
               class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">验证码</label>
        <div class="flex gap-2">
          <input name="captcha" required maxlength="6"
                 class="flex-1 px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none" />
          <img :src="'{{ url_for('auth.captcha') }}?_=' + captchaTs"
               @click="captchaTs = Date.now()"
               class="h-10 rounded-lg border border-slate-200 cursor-pointer" alt="验证码" title="点击换一张" />
        </div>
      </div>
      <label class="inline-flex items-center gap-2 text-sm text-slate-600">
        <input type="checkbox" name="remember" class="rounded text-indigo-600 focus:ring-indigo-500" />
        记住我
      </label>
      <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg shadow-sm">登录</button>
    </form>
    <p class="text-center text-sm text-slate-500 mt-6">
      还没有账号？<a class="text-indigo-600 hover:underline" href="{{ url_for('auth.register') }}">立即注册</a>
    </p>
  </div>
</div>
{% endblock %}
