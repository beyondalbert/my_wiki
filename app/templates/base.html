<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="csrf-token" content="{{ csrf_token() }}" />
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/css/inter.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/css/tailwind.min.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/css/highlight-github.min.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
  <script defer src="{{ url_for('static', filename='vendor/js/alpine.min.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block head_extra %}{% endblock %}
</head>
<body class="h-full bg-slate-50 text-slate-800 font-sans antialiased">
  {% block layout %}
  <div class="min-h-full flex flex-col">
    {% include "components/navbar.html" %}
    <main class="flex-1">
      {% include "components/flash.html" %}
      {% block content %}{% endblock %}
    </main>
    {% include "components/footer.html" %}
  </div>
  {% endblock %}
  {% block body_extra %}{% endblock %}
</body>
</html>
