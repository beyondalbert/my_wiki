{% extends "base.html" %}
{% block title %}新建知识库 · {{ site_name }}{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto px-4 py-10">
  <h1 class="text-2xl font-bold text-slate-800 mb-6">新建知识库</h1>
  <form method="post" class="bg-white border border-slate-200 rounded-2xl p-6 space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">名称 *</label>
      <input name="name" required maxlength="80" value="{{ form.name or '' }}"
             class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" />
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">描述</label>
      <textarea name="description" rows="3" maxlength="500"
                class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">{{ form.description or '' }}</textarea>
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-2">可见性</label>
      <div class="grid sm:grid-cols-3 gap-3">
        {% for v, label, desc, color in [
          ('private','私密','仅自己可见','slate'),
          ('members','成员','已邀请的成员可见','amber'),
          ('public','公开','所有人都能浏览','emerald'),
        ] %}
          <label class="cursor-pointer">
            <input type="radio" name="visibility" value="{{ v }}" class="peer sr-only" {{ 'checked' if (form.visibility or 'private') == v }} />
            <div class="border-2 border-slate-200 peer-checked:border-{{ color }}-500 peer-checked:bg-{{ color }}-50 rounded-lg p-3">
              <div class="font-medium text-slate-800">{{ label }}</div>
              <div class="text-xs text-slate-500 mt-1">{{ desc }}</div>
            </div>
          </label>
        {% endfor %}
      </div>
    </div>
    <div class="flex gap-2 pt-2">
      <button class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-500" type="submit">创建</button>
      <a class="px-4 py-2 border border-slate-300 rounded-lg hover:bg-slate-50" href="{{ url_for('kb.list_kbs') }}">取消</a>
    </div>
  </form>
</div>
{% endblock %}
