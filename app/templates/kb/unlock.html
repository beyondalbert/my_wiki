{% extends "base.html" %}
{% block title %}访问密码 · {{ kb.name }} · {{ site_name }}{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
  <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-8">
    <div class="flex items-center gap-3 mb-4">
      <div class="w-10 h-10 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-xl">🔒</div>
      <div>
        <h1 class="text-lg font-semibold text-slate-800">{{ kb.name }}</h1>
        <p class="text-xs text-slate-500 mt-0.5">该公开知识库受密码保护，请输入访问密码</p>
      </div>
    </div>
    {% if kb.description %}
      <p class="text-sm text-slate-600 mb-4 line-clamp-2">{{ kb.description }}</p>
    {% endif %}
    <form method="post" class="space-y-3">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <input type="hidden" name="next" value="{{ next_url }}" />
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">访问密码</label>
        <input name="password" type="password" required autofocus
               class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
               placeholder="请输入密码" />
      </div>
      <button type="submit"
              class="w-full px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-medium">
        进入知识库
      </button>
    </form>
    <div class="mt-4 text-xs text-slate-400 text-center">
      <a href="{{ url_for('kb.list_kbs', tab='public') }}" class="hover:text-indigo-600">← 返回公开知识库列表</a>
    </div>
  </div>
</div>
{% endblock %}
